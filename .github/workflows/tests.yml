name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ubuntu-26.04 пока только проверка совместимости: падение там не делает общий результат красным
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Установка зависимостей
        working-directory: bot
        run: pip install -r requirements.txt
      - name: Запуск всех тестов
        working-directory: bot
        run: python run_tests.py

  repo-check:
    name: Проверка репозитория (секреты и базы)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Поиск секретов и файлов базы в индексе git
        run: python scripts/check_repo.py
