name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ubuntu-26.04 пока только проверка совместимости: падение там не делает общий результат красным
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python-version: ["3.9", "3.12"]
        exclude:
          # для Python 3.9 нет готовой сборки под Ubuntu 26.04 (setup-python: версия не найдена)
          - os: ubuntu-26.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Установка зависимостей
        working-directory: bot
        run: pip install -r requirements.txt
      - name: Запуск всех тестов
        working-directory: bot
        run: python run_tests.py

  repo-check:
    name: Проверка репозитория (секреты и базы)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Поиск секретов и файлов базы в индексе git
        run: python scripts/check_repo.py

  e2e:
    name: e2e в Chrome (Python 3.12, не блокирует)
    runs-on: ubuntu-24.04
    # первый этап: результат e2e не делает общий результат красным; после стабилизации сделать обязательным (журнал)
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bot/requirements.txt
            e2e/requirements.txt
      - name: Установка зависимостей сервера и e2e
        run: pip install -r bot/requirements.txt -r e2e/requirements.txt
      - name: Chrome из образа runner
        run: google-chrome --version
      - name: Запуск e2e
        run: python e2e/run_e2e.py
