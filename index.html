<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Депная</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
  <main class="app screen" data-screen="roulette">
    <header class="top">
      <div class="balance">Баланс: <strong id="balance">1000</strong></div>
      <div class="result" id="result" aria-live="polite">
        <span class="result-label">Выпало</span>
        <span class="result-number" id="result-number">—</span>
      </div>
    </header>

    <ol class="history-list" id="history-list" aria-label="Последние числа"></ol>

    <div class="table" id="table" aria-label="Стол"></div>

    <div class="message" id="message" aria-live="polite"></div>

    <section class="bets" id="bets">
      <div class="row">
        <input id="amount" type="number" inputmode="numeric" min="1" step="1" value="10" aria-label="Сумма ставки">
        <button type="button" class="chip" data-amount="10">10</button>
        <button type="button" class="chip" data-amount="50">50</button>
        <button type="button" class="chip" data-amount="100">100</button>
        <button type="button" class="chip" data-amount="500">500</button>
      </div>
      <div class="row">
        <button type="button" class="action" id="repeat-bets">Повтор</button>
        <button type="button" class="action" id="clear-bets">Убрать</button>
        <button id="spin" type="button">Крутить</button>
      </div>
    </section>
  </main>

  <section class="screen stub" data-screen="rating" hidden>Скоро</section>
  <section class="screen profile" data-screen="profile" hidden>
    <h2>Профиль</h2>
    <div class="profile-card" id="profile-data" hidden>
      <div>Баланс на сервере: <strong id="profile-balance"></strong></div>
      <div>Доход: <strong id="profile-rate"></strong> в час</div>
      <div>Следующее начисление через <strong id="profile-timer"></strong></div>
    </div>
    <p class="profile-msg" id="profile-msg" aria-live="polite"></p>
    <small class="profile-code" id="profile-code"></small>
    <button type="button" class="action profile-retry" id="profile-retry" hidden>Повторить</button>
  </section>

  <!-- колесо показывается поверх экрана только во время вращения, закрывает и панель -->
  <div class="wheel-layer" id="wheel-layer" aria-hidden="true">
    <div class="wheel-box">
      <canvas id="wheel" width="600" height="600"></canvas>
      <div class="ball" id="ball"></div>
    </div>
    <div class="layer-result" id="layer-result"></div>
  </div>

  <!-- меню игр: плитки строятся в script.js из массива GAMES -->
  <div class="game-menu" id="game-menu">
    <div class="game-panel" id="game-panel" role="menu"></div>
  </div>

  <!-- кнопки строятся в script.js из массива TABS -->
  <nav class="nav" id="nav" aria-label="Разделы"></nav>
  </div>

  <!-- поверх размытого фона, когда фишки закончились -->
  <div class="loan" id="loan" hidden>
    <button id="loan-btn" type="button">Взять микрозайм</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
