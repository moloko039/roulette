<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Депная</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Депная</h1>

    <div class="balance">Баланс: <strong id="balance">1000</strong> фишек</div>

    <section class="history">
      <span class="history-title">Последние числа</span>
      <ol class="history-list" id="history-list"></ol>
    </section>

    <!-- колесо и стол — единый игровой стол -->
    <section class="casino">
      <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
      </div>
      <div class="table" id="table" aria-label="Стол"></div>
    </section>

    <section class="bets" id="bets">
      <div class="row">
        <label for="amount">Сумма ставки:</label>
        <input id="amount" type="number" min="1" step="1" value="10">
        <button type="button" class="chip" data-amount="10">10</button>
        <button type="button" class="chip" data-amount="50">50</button>
        <button type="button" class="chip" data-amount="100">100</button>
        <button type="button" class="chip" data-amount="500">500</button>
      </div>
      <div class="row">
        <button type="button" class="action" id="repeat-bets">Повторить ставку</button>
        <button type="button" class="action" id="clear-bets">Убрать ставки</button>
      </div>
      <div class="message" id="message" aria-live="polite"></div>
    </section>

    <button id="spin" type="button">Крутить</button>

    <div class="result" id="result" aria-live="polite">
      <span class="result-label">Выпало:</span>
      <span class="result-number" id="result-number">—</span>
      <span class="result-color" id="result-color"></span>
    </div>
  </main>

  <!-- поверх размытого фона, когда фишки закончились -->
  <div class="loan" id="loan" hidden>
    <button id="loan-btn" type="button">Взять микрозайм</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
