<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Депная</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="balance">Баланс: <strong id="balance">1000</strong></div>
      <div class="result" id="result" aria-live="polite">
        <span class="result-label">Выпало</span>
        <span class="result-number" id="result-number">—</span>
      </div>
    </header>

    <ol class="history-list" id="history-list" aria-label="Последние числа"></ol>

    <div class="table" id="table" aria-label="Стол"></div>

    <div class="message" id="message" aria-live="polite"></div>

    <section class="bets" id="bets">
      <div class="row">
        <input id="amount" type="number" inputmode="numeric" min="1" step="1" value="10" aria-label="Сумма ставки">
        <button type="button" class="chip" data-amount="10">10</button>
        <button type="button" class="chip" data-amount="50">50</button>
        <button type="button" class="chip" data-amount="100">100</button>
        <button type="button" class="chip" data-amount="500">500</button>
      </div>
      <div class="row">
        <button type="button" class="action" id="repeat-bets">Повтор</button>
        <button type="button" class="action" id="clear-bets">Убрать</button>
        <button id="spin" type="button">Крутить</button>
      </div>
    </section>
  </main>

  <!-- колесо показывается поверх стола только во время вращения -->
  <div class="wheel-layer" id="wheel-layer" aria-hidden="true">
    <div class="wheel-box">
      <canvas id="wheel" width="600" height="600"></canvas>
      <div class="ball" id="ball"></div>
    </div>
    <div class="layer-result" id="layer-result"></div>
  </div>

  <!-- поверх размытого фона, когда фишки закончились -->
  <div class="loan" id="loan" hidden>
    <button id="loan-btn" type="button">Взять микрозайм</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
