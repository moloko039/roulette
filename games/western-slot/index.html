    <script>
      // If the game module never starts (stale cached page pointing at removed files, failed download),
      // offer a reload instead of a blank screen. main.ts sets the flag as its first statement.
      setTimeout(function () {
        if (window.__slotBooted) return;
        var node = document.createElement('button');
        node.className = 'boot-error';
        node.type = 'button';
        node.textContent = 'Не удалось загрузить игру. Нажмите, чтобы обновить';
        node.onclick = function () { location.reload(); };
        document.body.appendChild(node);
      }, 8000);
    </script>
